name: CI
on:
  push:
  pull_request:

jobs:
  package-linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  app-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
      - run: swift test
      - name: Build iOS app (simulator, unsigned)
        run: |
          xcodebuild -project SupernoteIOS.xcodeproj -scheme SupernoteIOS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -50
          exit ${PIPESTATUS[0]}
