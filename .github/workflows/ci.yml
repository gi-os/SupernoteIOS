name: Linux package

# NoteKit, SyncKit and the snsync CLI also build and pass their tests on Linux. The app itself is
# checked by Check (macOS, gi-os kit).
on:
  push:
  pull_request:

jobs:
  package-linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - run: swift test
